name: Firmware

on:
  push:
    branches: [ diagnostic/li-hy-0213-gy ]
    paths: [ "components/**", "firmware/**", "docs/**", ".github/workflows/firmware.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome==2026.10.2
      - name: Build the firmware from this commit
        run: esphome -s components_source ../components compile firmware/lampe-quntis.yaml
      - name: Prepare the installer site
        run: |
          mkdir -p site
          cp docs/* site/
          cp "$(find firmware/.esphome/build/lampe-quntis -name firmware.factory.bin | head -1)" site/lampe-quntis.factory.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
