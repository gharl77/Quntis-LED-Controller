name: Firmware

on:
  push:
    branches: [ main ]
    paths: [ "components/**", "firmware/**", "docs/**", "tests/**", ".github/workflows/firmware.yml" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # A build that already published a release must also deploy it.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the packet code
        run: |
          g++ -std=c++17 -Wall -Werror -I components tests/test_protocol.cpp -o test_protocol
          ./test_protocol

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pick the version
        # Year.month.number: one more than the month's last release, from 1.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="$(date -u +%Y).$((10#$(date -u +%m)))"
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sed -nE "s/^v${month//./\\.}\\.([0-9]+)$/\\1/p" | sort -n | tail -1)
          echo "VERSION=$month.$((10#${last:-0} + 1))" >> "$GITHUB_ENV"
      - name: Install ESPHome
        run: pip install esphome==2026.10.2
      - name: Build the firmware from this commit
        run: esphome -s components_source ../components -s version "$VERSION" compile firmware/lampe-quntis.yaml
      - name: Prepare the installer site
        run: |
          mkdir -p site
          cp docs/* site/
          build=firmware/.esphome/build/lampe-quntis/build
          cp "$build/firmware.factory.bin" site/lampe-quntis.factory.bin
          cp "$build/firmware.ota.bin" site/lampe-quntis.ota.bin
          python3 - <<'PY'
          import hashlib, json, os
          version = os.environ["VERSION"]
          md5 = hashlib.md5(open("site/lampe-quntis.ota.bin", "rb").read()).hexdigest()
          repo = os.environ["GITHUB_REPOSITORY"]
          manifest = {
              "name": "Lampe Quntis",
              "version": version,
              "home_assistant_domain": "esphome",
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32",
                  "improv": True,
                  "parts": [{"path": "lampe-quntis.factory.bin", "offset": 0}],
                  "ota": {
                      "path": "lampe-quntis.ota.bin",
                      "md5": md5,
                      "summary": f"Lampe Quntis {version}",
                      "release_url": f"https://github.com/{repo}/releases/tag/v{version}",
                  },
              }],
          }
          json.dump(manifest, open("site/manifest.json", "w"), indent=2)
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" site/lampe-quntis.factory.bin site/lampe-quntis.ota.bin \
            --target "$GITHUB_SHA" --title "Lampe Quntis $VERSION" \
            --notes "Firmware built from ${GITHUB_SHA::7}. Install it from https://gharl77.github.io/Quntis-LED-Controller/ or update it from Home Assistant."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
