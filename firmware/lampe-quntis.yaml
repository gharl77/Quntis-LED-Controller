# Ready-made firmware for the web installer. It has no personal values: the WiFi is set
# after installation, and the remote is learned from the web page or Home Assistant.
substitutions:
  name: lampe-quntis
  friendly_name: "Lampe Quntis"
  # The installer builds from this repository's files. Adopting the device in ESPHome
  # Builder fetches them from GitHub instead.
  components_source: github://gharl77/Quntis-LED-Controller@diagnostic/li-hy-0213-gy
  # Set by the GitHub build. Home Assistant offers an update when the published one differs.
  version: dev

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Lets several lamps on one network get different names.
  name_add_mac_suffix: true
  project:
    name: gharl77.quntis-0213
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: ${components_source}
    components: [ quntis_0213, quntis_web ]

# Lets ESPHome Builder offer to adopt the device and customize it.
dashboard_import:
  package_import_url: github://gharl77/Quntis-LED-Controller/firmware/lampe-quntis.yaml@diagnostic/li-hy-0213-gy
  import_full_config: true

logger:

api:
  # Home Assistant sends an encryption key on its first connection.
  encryption: {}

ota:
  - platform: esphome
  # Installs the update that Home Assistant offers.
  - platform: http_request

http_request:

# Checks the installer page for a newer firmware.
update:
  - platform: http_request
    name: "Firmware"
    source: https://gharl77.github.io/Quntis-LED-Controller/manifest.json

wifi:
  # Started when the ESP32 has no WiFi or cannot join it. The password is public:
  # set the WiFi soon after installing.
  ap:
    ssid: "Lampe Quntis"
    password: "quntis1234"

captive_portal:

# WiFi setup from the web installer, over USB.
improv_serial:

quntis_web:
  light_id: lampe

# Adds the "Visit" link in Home Assistant. The quntis_web page answers the requests.
web_server:
  port: 80
  version: 2

# WiFi setup over Bluetooth, while the ESP32 is not connected.
esp32_ble:
  name: "Lampe Quntis"

improv_ble:
  authorizer: none

# The time of day, for "Température selon l'heure".
time:
  - platform: homeassistant
    id: heure

light:
  - platform: quntis_0213
    id: lampe
    name: "Lampe"
    # Shows the last known state after a restart. A power cut turns the lamp off,
    # so it can be wrong until the next command or remote press.
    restore_mode: RESTORE_DEFAULT_OFF
    # Fades between levels, like a smart bulb. Set 0s to change at once.
    default_transition_length: 1s
    time_id: heure
    on_remote:
      - lambda: 'id(telecommande).trigger(button);'

    # DOIT ESP32 DevKit V1 wiring
    ce_pin: 17
    cs_pin: 5
    spi_clk_pin: 18
    spi_mosi_pin: 23
    spi_miso_pin: 19

    # The remote is learned from the web page or from Home Assistant.
    channel: 80

switch:
  - platform: template
    name: "Rétroéclairage"
    icon: mdi:television-ambient-light
    restore_mode: DISABLED
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_backlight();'
    turn_on_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_backlight(true);'
    turn_off_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_backlight(false);'
  - platform: template
    name: "Variation automatique"
    icon: mdi:brightness-auto
    restore_mode: DISABLED
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_auto_dim();'
    turn_on_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_dim(true);'
    turn_off_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_dim(false);'
  - platform: template
    name: "Température selon l'heure"
    icon: mdi:theme-light-dark
    restore_mode: DISABLED
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_auto_temperature();'
    turn_on_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_temperature(true);'
    turn_off_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_temperature(false);'

# One event per press on the remote, for Home Assistant automations.
event:
  - platform: template
    id: telecommande
    name: "Télécommande"
    icon: mdi:remote
    device_class: button
    event_types: [power, brightness, brightness_up, brightness_down, temperature, temperature_up,
      temperature_down, backlight, auto_dim, other,
      power_long, brightness_long, brightness_up_long, brightness_down_long, temperature_long,
      temperature_up_long, temperature_down_long, backlight_long, auto_dim_long, other_long]

# Turns the lamp off after this many minutes. 0 cancels.
number:
  - platform: template
    name: "Minuterie"
    icon: mdi:timer-outline
    unit_of_measurement: min
    min_value: 0
    max_value: 240
    step: 5
    mode: box
    update_interval: 30s
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_timer_minutes();'
    set_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->start_timer((uint32_t) x);'

button:
  - platform: template
    name: "Apprendre la télécommande"
    icon: mdi:remote
    entity_category: config
    on_press:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->start_learning();'
  # Presets: buttons without a category also show on the web page.
  - platform: template
    name: "Lecture"
    icon: mdi:book-open-variant
    on_press:
      - light.turn_on: { id: lampe, brightness: 100%, color_temperature: 5000 K }
  - platform: template
    name: "Écran"
    icon: mdi:monitor
    on_press:
      - light.turn_on: { id: lampe, brightness: 60%, color_temperature: 4000 K }
  - platform: template
    name: "Soir"
    icon: mdi:weather-night
    on_press:
      - light.turn_on: { id: lampe, brightness: 30%, color_temperature: 3000 K }

sensor:
  - platform: template
    name: "Paquets radio reçus"
    icon: mdi:radio-tower
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_packets_received();'
  - platform: template
    name: "Appuis de la télécommande"
    icon: mdi:gesture-tap-button
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_presses_received();'
  - platform: template
    name: "Durée du dernier appui"
    icon: mdi:timer-sand
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_last_press_ms();'
  - platform: template
    name: "Paquets du dernier appui"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_last_press_packets();'

# The last remote packet: command, brightness, color temperature and backlight.
text_sensor:
  - platform: template
    name: "Dernier paquet de la télécommande"
    icon: mdi:code-brackets
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      auto *v = static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->last_remote_values();
      char text[12];
      snprintf(text, sizeof(text), "%02X %02X %02X %02X", v[0], v[1], v[2], v[3]);
      return std::string(text);
