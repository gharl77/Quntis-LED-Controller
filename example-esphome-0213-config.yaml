substitutions:
  slug: quntis-0213
  name: "Lampe Quntis"

esphome:
  name: ${slug}
  friendly_name: ${name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components
    components: [ quntis_0213, quntis_web ]

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Backup network, started when the ESP32 cannot join the WiFi.
  ap:
    ssid: "Lampe Quntis"
    password: !secret ap_password

captive_portal:

quntis_web:
  light_id: lampe

# WiFi setup over Bluetooth, while the ESP32 is not connected.
esp32_ble:
  name: "Lampe Quntis"

improv_ble:
  authorizer: none

light:
  - platform: quntis_0213
    id: lampe
    name: "Lampe"
    # The lamp turns off when it loses power, and nothing is sent at boot.
    restore_mode: ALWAYS_OFF

    # DOIT ESP32 DevKit V1 wiring
    ce_pin: 17
    cs_pin: 5
    spi_clk_pin: 18
    spi_mosi_pin: 23
    spi_miso_pin: 19

    # Replace with the values captured from your own remote: see the README.
    channel: 80
    device_address: [0x00, 0x00, 0x00, 0x00, 0x00]
    remote_id: [0x00, 0x00, 0x00, 0x00]

switch:
  - platform: template
    name: "Rétroéclairage"
    icon: mdi:television-ambient-light
    restore_mode: DISABLED
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_backlight();'
    turn_on_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_backlight(true);'
    turn_off_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_backlight(false);'
  - platform: template
    name: "Variation automatique"
    icon: mdi:brightness-auto
    restore_mode: DISABLED
    lambda: 'return static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->get_auto_dim();'
    turn_on_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_dim(true);'
    turn_off_action:
      - lambda: 'static_cast<esphome::quntis_0213::Quntis0213Light *>(id(lampe).get_output())->set_auto_dim(false);'
